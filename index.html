<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Desert Frontier</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #1a0e06;
      overflow: hidden;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%; height: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
'use strict';

const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

const COLS = 9;
const ROWS = 9;

let TW = 80;
let TH = 40;
let OX = 0;
let OY = 0;

function gridToScreen(col, row) {
    return {
        x: OX + (col - row) * TW * 0.5,
        y: OY + (col + row) * TH * 0.5,
    };
}

function screenToGrid(sx, sy) {
    const rx = sx - OX;
    const ry = sy - OY;
    return {
        col: rx / TW + ry / TH,
        row: ry / TH - rx / TW,
    };
}

function tileCenter(col, row) {
    const t = gridToScreen(col, row);
    return { x: t.x, y: t.y + TH * 0.5 };
}

function inBounds(col, row) {
    return col >= 0 && col < COLS && row >= 0 && row < ROWS;
}

function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    const fitByW = (canvas.width  - 48) * 2 / (COLS + ROWS - 2);
    const fitByH = (canvas.height - 96) * 4 / (COLS + ROWS);
    const raw    = Math.floor(Math.min(fitByW, fitByH));
    TW = raw % 2 === 0 ? raw : raw - 1;
    TH = TW >> 1;
    OX = canvas.width * 0.5;
    OY = (canvas.height - TH * (COLS + ROWS) * 0.5) * 0.5 + 16;
    const pc = tileCenter(player.col, player.row);
    player.x  = pc.x;
    player.y  = pc.y;
    const tc = tileCenter(player.targetCol, player.targetRow);
    player.tx = tc.x;
    player.ty = tc.y;
}
window.addEventListener('resize', resize);

const tileMap = (() => {
    const m = Array.from({ length: ROWS }, () => new Uint8Array(COLS));
    for (let i = 0; i < COLS; i++) m[4][i] = 1;
    for (let i = 0; i < ROWS; i++) m[i][4] = 1;
    return m;
})();

const SEED = Array.from({ length: ROWS }, (_, r) =>
    Array.from({ length: COLS }, (_, c) => ((r * 97 + c * 61 + 13) % 100) / 100)
);

const PAL = {
    0: { top: '#c8a06a' },
    1: { top: '#a07848' },
};

const player = {
    col: 4, row: 4,
    targetCol: 4, targetRow: 4,
    x: 0, y: 0,
    tx: 0, ty: 0,
    speed: 180,
    moving: false,
    bobPhase: 0,
};

let hoveredCol = -1;
let hoveredRow = -1;
let pulseT = 0;

function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
    g.addColorStop(0, '#d4956a');
    g.addColorStop(0.5, '#a06030');
    g.addColorStop(1, '#1a0e06');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawTile(col, row, highlight) {
    const { x, y } = gridToScreen(col, row);
    const hw = TW * 0.5;
    const hh = TH * 0.5;
    const pal = PAL[tileMap[row][col]] || PAL[0];
    ctx.beginPath();
    ctx.moveTo(x,      y);
    ctx.lineTo(x + hw, y + hh);
    ctx.lineTo(x,      y + TH);
    ctx.lineTo(x - hw, y + hh);
    ctx.closePath();
    ctx.fillStyle   = highlight ? '#ddc070' : pal.top;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth   = 0.5;
    ctx.stroke();
}

function drawTileDetail(col, row) {
    const s = SEED[row][col];
    if (tileMap[row][col] === 1) return;
    if (col === player.col && row === player.row) return;
    const { x, y } = gridToScreen(col, row);
    if (s > 0.76) {
        const rx = x + (s * 2 - 1) * TW * 0.22;
        const ry = y + TH * 0.48 + s * TH * 0.18;
        ctx.fillStyle = '#8a7050';
        ctx.beginPath();
        ctx.ellipse(rx, ry, TW * 0.07, TH * 0.065, 0.4, 0, Math.PI * 2);
        ctx.fill();
    } else if (s < 0.13) {
        const cx = x + (s * 10 - 0.6) * TW * 0.09;
        const cy = y + TH * 0.52;
        const cw = Math.max(0.8, TW * 0.022);
        ctx.strokeStyle = '#5a8838';
        ctx.lineWidth = cw;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - TH * 0.44); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy - TH * 0.28); ctx.lineTo(cx - TW * 0.07, cy - TH * 0.40); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy - TH * 0.18); ctx.lineTo(cx + TW * 0.065, cy - TH * 0.30); ctx.stroke();
    } else if (s > 0.60 && s < 0.67) {
        const gx = x + (s - 0.6) * TW * 1.4 - TW * 0.06;
        const gy = y + TH * 0.5 + s * TH * 0.1;
        ctx.strokeStyle = '#9a8050';
        ctx.lineWidth = Math.max(0.5, TW * 0.015);
        ctx.lineCap = 'round';
        for (let i = -1; i <= 1; i++) {
            ctx.beginPath();
            ctx.moveTo(gx + i * TW * 0.025, gy);
            ctx.lineTo(gx + i * TW * 0.04 + (i - 0.5) * TW * 0.03, gy - TH * 0.28);
            ctx.stroke();
        }
    }
}

function drawTargetMarker(col, row) {
    const { x, y } = gridToScreen(col, row);
    const hw = TW * 0.5;
    const hh = TH * 0.5;
    const alpha = 0.42 + 0.42 * Math.sin(pulseT * 4.5);
    ctx.beginPath();
    ctx.moveTo(x,      y);
    ctx.lineTo(x + hw, y + hh);
    ctx.lineTo(x,      y + TH);
    ctx.lineTo(x - hw, y + hh);
    ctx.closePath();
    ctx.fillStyle   = `rgba(255,216,48,${alpha * 0.28})`;
    ctx.strokeStyle = `rgba(255,200,24,${alpha})`;
    ctx.lineWidth   = 2.5;
    ctx.fill();
    ctx.stroke();
}

function drawPlayer(cx, cy, bob) {
    const y  = cy + bob;
    const bw = TW * 0.14;
    const bd = TH * 0.17;
    const bH = TH * 0.92;
    const hR = TW * 0.11;

    ctx.beginPath();
    ctx.ellipse(cx, y + bd * 0.4, bw * 1.5, bd * 0.72, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cx + bw, y - bH);
    ctx.lineTo(cx,      y + bd - bH);
    ctx.lineTo(cx,      y + bd);
    ctx.lineTo(cx + bw, y);
    ctx.closePath();
    ctx.fillStyle = '#c85030';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.28)';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx - bw, y - bH);
    ctx.lineTo(cx,      y + bd - bH);
    ctx.lineTo(cx,      y + bd);
    ctx.lineTo(cx - bw, y);
    ctx.closePath();
    ctx.fillStyle = '#a03820';
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx,      y - bd - bH);
    ctx.lineTo(cx + bw, y - bH);
    ctx.lineTo(cx,      y + bd - bH);
    ctx.lineTo(cx - bw, y - bH);
    ctx.closePath();
    ctx.fillStyle = '#e06840';
    ctx.fill();
    ctx.stroke();

    const headY = y - bd - bH - hR * 1.05;
    ctx.beginPath();
    ctx.arc(cx, headY, hR, 0, Math.PI * 2);
    ctx.fillStyle = '#efc070';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(cx, headY - hR * 0.32, hR * 1.68, hR * 0.42, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#4e2a10';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cx - hR * 0.74, headY - hR * 0.32);
    ctx.lineTo(cx - hR * 0.56, headY - hR * 1.80);
    ctx.lineTo(cx + hR * 0.56, headY - hR * 1.80);
    ctx.lineTo(cx + hR * 0.74, headY - hR * 0.32);
    ctx.closePath();
    ctx.fillStyle = '#6a3e1c';
    ctx.fill();

    ctx.strokeStyle = '#d09038';
    ctx.lineWidth = Math.max(0.8, hR * 0.22);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - hR * 0.70, headY - hR * 0.54);
    ctx.lineTo(cx + hR * 0.70, headY - hR * 0.54);
    ctx.stroke();
}

function drawHUD() {
    const pad   = 10;
    const fSize = Math.max(12, Math.min(16, TW * 0.22));
    ctx.save();
    ctx.fillStyle   = 'rgba(0,0,0,0.50)';
    ctx.strokeStyle = 'rgba(255,200,80,0.30)';
    ctx.lineWidth   = 1;
    const hudW = fSize * 11;
    const hudH = fSize * 2.8;
    ctx.beginPath();
    ctx.roundRect(pad, pad, hudW, hudH, 8);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle    = '#ffd898';
    ctx.font         = `bold ${fSize}px monospace`;
    ctx.textBaseline = 'middle';
    ctx.fillText(`Tile  (${player.col}, ${player.row})`, pad + 10, pad + hudH * 0.32);
    ctx.fillStyle = 'rgba(255,210,140,0.70)';
    ctx.font      = `${fSize * 0.82}px monospace`;
    ctx.fillText('Tap any tile to move', pad + 10, pad + hudH * 0.75);
    ctx.restore();
}

let lastTime = 0;

function update(dt) {
    pulseT += dt;
    player.bobPhase += dt * (player.moving ? 9 : 2.2);
    if (!player.moving) return;
    const dx   = player.tx - player.x;
    const dy   = player.ty - player.y;
    const dist = Math.hypot(dx, dy);
    const step = player.speed * dt;
    if (dist <= step) {
        player.x   = player.tx;
        player.y   = player.ty;
        player.col = player.targetCol;
        player.row = player.targetRow;
        player.moving = false;
    } else {
        player.x += (dx / dist) * step;
        player.y += (dy / dist) * step;
    }
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();
    for (let d = 0; d < COLS + ROWS - 1; d++) {
        const cMin = Math.max(0, d - ROWS + 1);
        const cMax = Math.min(COLS - 1, d);
        for (let c = cMin; c <= cMax; c++) {
            const r = d - c;
            const isHovered = c === hoveredCol && r === hoveredRow;
            const isTarget  = c === player.targetCol && r === player.targetRow && player.moving;
            drawTile(c, r, isHovered);
            drawTileDetail(c, r);
            if (isTarget) drawTargetMarker(c, r);
        }
    }
    const bob = Math.sin(player.bobPhase) * (player.moving ? TH * 0.07 : TH * 0.028);
    drawPlayer(player.x, player.y, bob);
    drawHUD();
}

function loop(timestamp) {
    const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
    lastTime  = timestamp;
    update(dt);
    render();
    requestAnimationFrame(loop);
}

function handlePointer(sx, sy) {
    const { col, row } = screenToGrid(sx, sy);
    const c = Math.floor(col);
    const r = Math.floor(row);
    if (!inBounds(c, r)) return;
    player.targetCol = c;
    player.targetRow = r;
    const tc = tileCenter(c, r);
    player.tx = tc.x;
    player.ty = tc.y;
    player.moving = !(c === player.col && r === player.row);
}

function handleHover(sx, sy) {
    const { col, row } = screenToGrid(sx, sy);
    const c = Math.floor(col);
    const r = Math.floor(row);
    hoveredCol = inBounds(c, r) ? c : -1;
    hoveredRow = inBounds(c, r) ? r : -1;
}

canvas.addEventListener('click', e => handlePointer(e.clientX, e.clientY));
canvas.addEventListener('mousemove', e => handleHover(e.clientX, e.clientY));
canvas.addEventListener('mouseleave', () => { hoveredCol = -1; hoveredRow = -1; });

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    handlePointer(t.clientX, t.clientY);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    handleHover(t.clientX, t.clientY);
}, { passive: false });

canvas.addEventListener('touchend', e => { e.preventDefault(); }, { passive: false });

resize();
const initCenter = tileCenter(player.col, player.row);
player.x  = initCenter.x;
player.y  = initCenter.y;
player.tx = initCenter.x;
player.ty = initCenter.y;

requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
  </script>
</body>
</html>
