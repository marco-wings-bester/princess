<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Princess Maze - Three Kingdoms</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #bde6ff;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #3a2a5a;
    overflow: hidden; user-select: none;
  }
  #game { display: block; cursor: crosshair; }
  #hud {
    position: fixed; top: 12px; left: 12px;
    background: rgba(255, 248, 240, 0.92);
    border: 2px solid #ffb3d9; border-radius: 12px;
    padding: 10px 14px; font-size: 14px;
    box-shadow: 0 4px 18px rgba(255, 150, 200, 0.35);
    color: #5a3a70;
  }
  #hud h1 { margin: 0 0 6px 0; font-size: 16px; color: #e85aa0; letter-spacing: 1px; }
  #hud .row { margin: 3px 0; }
  #hud .key {
    display: inline-block; background: #fff0f7;
    border: 1px solid #ffb3d9; border-radius: 3px;
    padding: 1px 6px; margin-right: 4px;
    font-family: monospace; font-size: 12px; color: #b4337a;
  }
  #minimap {
    position: fixed; top: 12px; right: 12px;
    border: 2px solid #ffb3d9; border-radius: 10px;
    background: rgba(255, 248, 240, 0.92);
    box-shadow: 0 4px 15px rgba(255, 150, 200, 0.3);
  }
  #message {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 250, 245, 0.98);
    border: 3px solid #ff9cc7; border-radius: 16px;
    padding: 30px 50px; text-align: center;
    display: none;
    box-shadow: 0 8px 40px rgba(255, 150, 200, 0.5);
    color: #5a3a70; z-index: 20;
  }
  #message h2 { margin: 0 0 10px 0; color: #e85aa0; font-size: 32px; }
  #message p { margin: 5px 0; font-size: 16px; }
  #message button {
    margin-top: 15px; padding: 8px 20px;
    background: #ff9cc7; border: none; color: white;
    font-size: 16px; border-radius: 8px; cursor: pointer;
    box-shadow: 0 3px 0 #e06ea0;
  }
  #message button:hover { background: #ffb3d9; }
  #gatePrompt {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 250, 245, 0.97);
    border: 3px solid #ff9cc7; border-radius: 14px;
    padding: 14px 30px; font-size: 22px;
    font-weight: bold; color: #5a3a70;
    display: none;
    box-shadow: 0 6px 20px rgba(255, 150, 200, 0.4);
  }
  #gatePrompt .q { color: #e85aa0; font-size: 28px; }
  #gatePrompt .sub { font-size: 13px; color: #8a6a9a; font-weight: normal; display: block; margin-top: 4px; }
  #levelBanner {
    position: fixed; top: 35%; left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 250, 245, 0.95);
    border: 3px solid #ffd24a; border-radius: 14px;
    padding: 20px 40px; font-size: 32px;
    font-weight: bold; color: #b4337a;
    display: none; text-align: center;
    box-shadow: 0 6px 30px rgba(255, 200, 100, 0.5);
  }
  #levelBanner .sub { font-size: 16px; color: #5a3a70; display: block; margin-top: 6px; font-weight: normal; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <h1>🏰 Princess Maze 🌸</h1>
  <div class="row">Level: <span id="levelNum">1</span></div>
  <div class="row"><span class="key">↑ ↓ ← →</span> Move</div>
  <div class="row"><span class="key">Click</span> Move to spot</div>
  <div class="row"><span class="key">T</span> Spin attack</div>
  <div class="row" id="fireRow" style="display:none;"><span class="key">Z</span> Breathe fire</div>
  <div class="row"><span class="key">W A S D</span> Pan camera</div>
  <div class="row"><span class="key">Wheel</span> Zoom</div>
  <div class="row" style="margin-top:8px;">Gems: <span id="gemCount">0</span> / <span id="gemTotal">0</span></div>
  <div class="row">Time: <span id="time">0.0s</span></div>
</div>
<canvas id="minimap" width="180" height="180"></canvas>
<div id="gatePrompt"></div>
<div id="levelBanner"></div>
<div id="message">
  <h2 id="msgTitle">You Win!</h2>
  <p id="msgBody"></p>
  <button onclick="restart()">Play Again</button>
</div>

<script>
/* ============ PRINCESS MAZE — THREE KINGDOMS ============ */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const miniCanvas = document.getElementById('minimap');
const miniCtx = miniCanvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/* ---------- Config ---------- */
const COLS = 31, ROWS = 31, TILE = 48;
let maze = [];
let level = 1;

/* ---------- Maze generation ---------- */
function generateMaze() {
  maze = Array.from({ length: ROWS }, () => Array(COLS).fill(1));
  const stack = [[1, 1]];
  maze[1][1] = 0;
  const dirs = [[0,-2],[0,2],[-2,0],[2,0]];
  while (stack.length) {
    const [cx, cy] = stack[stack.length - 1];
    const shuffled = dirs.slice().sort(() => Math.random() - 0.5);
    let carved = false;
    for (const [dx, dy] of shuffled) {
      const nx = cx + dx, ny = cy + dy;
      if (nx > 0 && ny > 0 && nx < COLS-1 && ny < ROWS-1 && maze[ny][nx] === 1) {
        maze[ny][nx] = 0;
        maze[cy + dy/2][cx + dx/2] = 0;
        stack.push([nx, ny]);
        carved = true;
        break;
      }
    }
    if (!carved) stack.pop();
  }
  for (let i = 0; i < 30; i++) {
    const x = 1 + 2*Math.floor(Math.random()*(COLS/2-1));
    const y = 1 + 2*Math.floor(Math.random()*(ROWS/2-1));
    const d = dirs[Math.floor(Math.random()*4)];
    const nx = x + d[0]/2, ny = y + d[1]/2;
    if (nx > 0 && ny > 0 && nx < COLS-1 && ny < ROWS-1) maze[ny][nx] = 0;
  }
  maze[1][1] = 0; maze[1][2] = 0; maze[2][1] = 0;
  maze[ROWS-2][COLS-2] = 0; maze[ROWS-2][COLS-3] = 0; maze[ROWS-3][COLS-2] = 0;
}

/* ---------- Entities ---------- */
let princess, startCastle, goalCastle, gems, ghosts, flowers;
let dressPads, gates;
let fireballs = [];
let spinAttack = null; // {t, duration}

const DRESS_COLORS = [
  { main: '#4da6ff', light: '#7ec4ff', accent: '#ff5a9c', name: 'blue' },
  { main: '#ff5a9c', light: '#ff9cc7', accent: '#7ec4ff', name: 'pink' },
  { main: '#a86aff', light: '#c9a0ff', accent: '#ffd24a', name: 'purple' },
  { main: '#ffd24a', light: '#ffe89a', accent: '#ff5a9c', name: 'gold' },
  { main: '#5fd080', light: '#a3e6b8', accent: '#ff5a9c', name: 'mint' },
  { main: '#ff7a3a', light: '#ffb07a', accent: '#fff0c2', name: 'orange' },
];

function initEntities() {
  startCastle = { cx: 1, cy: 1 };
  goalCastle  = { cx: COLS - 2, cy: ROWS - 2 };

  princess = {
    x: (startCastle.cx + 0.5) * TILE,
    y: (startCastle.cy + 0.5) * TILE,
    r: TILE * 0.32,
    speed: 180,
    path: [],
    facing: 0,
    bob: 0,
    dress: DRESS_COLORS[0],
    onDragon: (level >= 2),
    fireCooldown: 0,
    spinCooldown: 0,
    hurtFlash: 0
  };

  if (princess.onDragon) {
    princess.r = TILE * 0.42;
    princess.speed = 220;
  }

  // Gems
  gems = [];
  const openCells = [];
  for (let y = 1; y < ROWS-1; y++)
    for (let x = 1; x < COLS-1; x++)
      if (maze[y][x] === 0 &&
          !(x===startCastle.cx && y===startCastle.cy) &&
          !(x===goalCastle.cx && y===goalCastle.cy))
        openCells.push([x, y]);
  openCells.sort(() => Math.random() - 0.5);
  const gemCount = 6;
  for (let i = 0; i < gemCount && i < openCells.length; i++) {
    gems.push({ cx: openCells[i][0], cy: openCells[i][1], collected: false, spin: Math.random()*Math.PI*2 });
  }

  // Ghosts — friendly on 1 & 2, harmful on 3
  ghosts = [];
  const ghostColors = ['#ffe6f2', '#fff0c2', '#d6f5ff', '#e6d9ff', '#d9ffea'];
  const ghostCount = level === 3 ? 6 : 5;
  let idx = gemCount;
  for (let i = 0; i < ghostCount && idx < openCells.length; i++, idx++) {
    const [cx, cy] = openCells[idx];
    ghosts.push({
      x: (cx + 0.5) * TILE, y: (cy + 0.5) * TILE,
      r: TILE * 0.3,
      speed: level === 3 ? 75 : 55,
      path: [], repathTimer: 0,
      color: level === 3 ? '#3a1a4a' : ghostColors[i % ghostColors.length],
      bob: Math.random()*Math.PI*2, waveTimer: 0,
      hostile: level === 3,
      alive: true,
      deathT: 0
    });
  }

  // Flowers
  flowers = [];
  for (; idx < openCells.length; idx++) {
    if (Math.random() < 0.15) {
      const [cx, cy] = openCells[idx];
      flowers.push({
        x: (cx + 0.3 + Math.random()*0.4) * TILE,
        y: (cy + 0.3 + Math.random()*0.4) * TILE,
        color: ['#ff9cc7', '#ffd24a', '#b4a4ff', '#ff7f9c'][Math.floor(Math.random()*4)],
        size: 0.15 + Math.random()*0.1,
        spin: Math.random() * Math.PI * 2
      });
    }
  }

  // Dress pads (level 1 only)
  dressPads = [];
  if (level === 1) {
    const padCells = openCells.slice().sort(() => Math.random() - 0.5);
    for (let i = 0; i < 5 && i < padCells.length; i++) {
      const [cx, cy] = padCells[i];
      dressPads.push({
        cx, cy,
        color: DRESS_COLORS[(i+1) % DRESS_COLORS.length],
        spin: Math.random()*Math.PI*2
      });
    }
  }

  // Gates (level 2 & 3)
  gates = [];
  if (level >= 2) {
    // Pick corridor cells (tiles with exactly 2 open neighbors in opposite directions)
    const corridors = [];
    for (let y = 2; y < ROWS - 2; y++) {
      for (let x = 2; x < COLS - 2; x++) {
        if (maze[y][x] !== 0) continue;
        const horiz = maze[y][x-1] === 0 && maze[y][x+1] === 0 && maze[y-1][x] === 1 && maze[y+1][x] === 1;
        const vert  = maze[y-1][x] === 0 && maze[y+1][x] === 0 && maze[y][x-1] === 1 && maze[y][x+1] === 1;
        if (horiz || vert) {
          // Must not be near start/goal
          const dS = Math.abs(x - startCastle.cx) + Math.abs(y - startCastle.cy);
          const dG = Math.abs(x - goalCastle.cx) + Math.abs(y - goalCastle.cy);
          if (dS > 3 && dG > 3) corridors.push([x, y, horiz]);
        }
      }
    }
    corridors.sort(() => Math.random() - 0.5);
    const gateCount = 4;
    const used = new Set();
    for (const [x, y, horiz] of corridors) {
      if (gates.length >= gateCount) break;
      // Avoid gates too close to each other
      let close = false;
      for (const g of gates) {
        if (Math.abs(g.cx - x) + Math.abs(g.cy - y) < 4) { close = true; break; }
      }
      if (close) continue;
      used.add(y*COLS+x);
      gates.push(makeGate(x, y, horiz));
    }
  }
}

function makeGate(cx, cy, horiz) {
  let challenge;
  if (level === 2) {
    // simple single-digit +/- with single-digit answer
    let a, b, op, answer;
    do {
      a = Math.floor(Math.random()*9) + 1;
      b = Math.floor(Math.random()*9) + 1;
      op = Math.random() < 0.5 ? '+' : '-';
      if (op === '+') answer = a + b;
      else { if (a < b) [a, b] = [b, a]; answer = a - b; }
    } while (answer > 9 || answer < 0);
    challenge = { type: 'math', question: `${a} ${op} ${b} = ?`, answer: String(answer) };
  } else {
    // level 3: mix of letter and slightly harder math
    if (Math.random() < 0.5) {
      const letter = String.fromCharCode(65 + Math.floor(Math.random()*26));
      challenge = { type: 'letter', question: `Press the letter: ${letter}`, answer: letter.toLowerCase(), display: letter };
    } else {
      // slightly harder: answer may be up to 2 digits, single-digit accepted via auto-submit on exact match
      let a, b, op, answer;
      do {
        a = Math.floor(Math.random()*9) + 2;
        b = Math.floor(Math.random()*9) + 2;
        op = ['+','-','×'][Math.floor(Math.random()*3)];
        if (op === '+') answer = a + b;
        else if (op === '-') { if (a < b) [a, b] = [b, a]; answer = a - b; }
        else answer = a * b;
      } while (answer > 18 || answer < 0);
      challenge = { type: 'math', question: `${a} ${op} ${b} = ?`, answer: String(answer) };
    }
  }
  return {
    cx, cy, horiz,
    open: false,
    challenge,
    typed: '',
    shake: 0
  };
}

/* ---------- Camera ---------- */
const camera = { x: 0, y: 0, zoom: 1 };
function worldToScreen(wx, wy) {
  return { x: (wx - camera.x) * camera.zoom + canvas.width/2,
           y: (wy - camera.y) * camera.zoom + canvas.height/2 };
}
function screenToWorld(sx, sy) {
  return { x: (sx - canvas.width/2) / camera.zoom + camera.x,
           y: (sy - canvas.height/2) / camera.zoom + camera.y };
}

/* ---------- Pathfinding (A*) ---------- */
function aStar(sx, sy, gx, gy) {
  if (maze[gy] && maze[gy][gx] === 1) return null;
  const key = (x,y) => y*COLS+x;
  const open = new Map();
  const closed = new Set();
  const start = { x:sx, y:sy, g:0, h:Math.abs(gx-sx)+Math.abs(gy-sy), parent:null };
  start.f = start.g + start.h;
  open.set(key(sx,sy), start);
  while (open.size) {
    let current = null;
    for (const n of open.values())
      if (!current || n.f < current.f) current = n;
    if (current.x === gx && current.y === gy) {
      const path = [];
      let c = current;
      while (c) { path.unshift([c.x, c.y]); c = c.parent; }
      return path;
    }
    open.delete(key(current.x, current.y));
    closed.add(key(current.x, current.y));
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for (const [dx,dy] of dirs) {
      const nx = current.x+dx, ny = current.y+dy;
      if (nx<0||ny<0||nx>=COLS||ny>=ROWS) continue;
      if (maze[ny][nx] === 1) continue;
      // Path through closed gates blocked (for ghost pathing)
      const gate = gates.find(g => g.cx === nx && g.cy === ny && !g.open);
      if (gate) continue;
      const k = key(nx,ny);
      if (closed.has(k)) continue;
      const g = current.g + 1;
      const existing = open.get(k);
      if (!existing || g < existing.g) {
        const node = { x:nx, y:ny, g, h:Math.abs(gx-nx)+Math.abs(gy-ny), parent:current };
        node.f = node.g + node.h;
        open.set(k, node);
      }
    }
  }
  return null;
}

function setPrincessTarget(wx, wy) {
  const tx = Math.floor(wx / TILE);
  const ty = Math.floor(wy / TILE);
  if (tx<0||ty<0||tx>=COLS||ty>=ROWS) return;
  if (maze[ty][tx] === 1) return;
  const sx = Math.floor(princess.x / TILE);
  const sy = Math.floor(princess.y / TILE);
  const path = aStar(sx, sy, tx, ty);
  if (path && path.length > 1) {
    princess.path = path.slice(1).map(([x,y]) => ({
      x: (x+0.5)*TILE, y: (y+0.5)*TILE
    }));
    ripples.push({ x:(tx+0.5)*TILE, y:(ty+0.5)*TILE, t:0 });
  }
}

/* ---------- Input ---------- */
const keys = {};
let activeGate = null;

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright'].includes(k)) {
    princess.path = [];
    e.preventDefault();
  }
  if (e.key === ' ') {
    camera.x = princess.x; camera.y = princess.y;
  }

  // Gate input handling
  if (activeGate && !activeGate.open) {
    const ch = activeGate.challenge;
    if (ch.type === 'letter') {
      if (k.length === 1 && /[a-z]/.test(k)) {
        if (k === ch.answer) {
          activeGate.open = true;
          sparkles.push({x: (activeGate.cx+0.5)*TILE, y: (activeGate.cy+0.5)*TILE, t:0});
        } else {
          activeGate.shake = 0.5;
        }
      }
    } else if (ch.type === 'math') {
      if (/^[0-9]$/.test(k)) {
        activeGate.typed += k;
        if (activeGate.typed === ch.answer) {
          activeGate.open = true;
          sparkles.push({x: (activeGate.cx+0.5)*TILE, y: (activeGate.cy+0.5)*TILE, t:0});
        } else if (!ch.answer.startsWith(activeGate.typed)) {
          activeGate.shake = 0.5;
          activeGate.typed = '';
        }
      } else if (e.key === 'Backspace') {
        activeGate.typed = activeGate.typed.slice(0, -1);
      }
    }
  }

  // Spin attack
  if (k === 't' && princess.spinCooldown <= 0 && !spinAttack) {
    spinAttack = { t: 0, duration: 0.5, x: princess.x, y: princess.y };
    princess.spinCooldown = 1.2;
  }

  // Fire breath (levels 2+)
  if (k === 'z' && princess.onDragon && princess.fireCooldown <= 0) {
    const dx = Math.cos(princess.facing), dy = Math.sin(princess.facing);
    for (let i = 0; i < 6; i++) {
      fireballs.push({
        x: princess.x + dx * princess.r,
        y: princess.y + dy * princess.r,
        vx: dx * (280 + Math.random()*80) + (Math.random()-0.5)*60,
        vy: dy * (280 + Math.random()*80) + (Math.random()-0.5)*60,
        life: 0, maxLife: 0.6,
        size: 8 + Math.random()*6
      });
    }
    princess.fireCooldown = 0.25;
  }
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

canvas.addEventListener('click', e => {
  const w = screenToWorld(e.clientX, e.clientY);
  setPrincessTarget(w.x, w.y);
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  camera.zoom = Math.max(0.4, Math.min(4.0, camera.zoom * factor));
}, { passive: false });

/* ---------- Movement helpers ---------- */
function canMoveTo(nx, ny, r) {
  const pts = [
    [nx - r*0.7, ny - r*0.7], [nx + r*0.7, ny - r*0.7],
    [nx - r*0.7, ny + r*0.7], [nx + r*0.7, ny + r*0.7],
  ];
  for (const [px, py] of pts) {
    const cx = Math.floor(px / TILE), cy = Math.floor(py / TILE);
    if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return false;
    if (maze[cy][cx] === 1) return false;
    // Closed gate blocks
    const gate = gates.find(g => g.cx === cx && g.cy === cy && !g.open);
    if (gate) return false;
  }
  return true;
}

/* ---------- Update ---------- */
const ripples = [];
const sparkles = [];
const hearts = [];
const poofs = []; // ghost deaths
let lastTime = performance.now();
let gameTime = 0;
let gameOver = false;
let levelBannerTimer = 0;

function update(dt) {
  if (gameOver) return;
  gameTime += dt;
  princess.fireCooldown = Math.max(0, princess.fireCooldown - dt);
  princess.spinCooldown = Math.max(0, princess.spinCooldown - dt);
  princess.hurtFlash = Math.max(0, princess.hurtFlash - dt);

  // Camera pan
  const panSpeed = 400 / camera.zoom;
  let panned = false;
  if (keys['w']) { camera.y -= panSpeed * dt; panned = true; }
  if (keys['s']) { camera.y += panSpeed * dt; panned = true; }
  if (keys['a']) { camera.x -= panSpeed * dt; panned = true; }
  if (keys['d']) { camera.x += panSpeed * dt; panned = true; }

  // Arrow movement
  let dx = 0, dy = 0;
  if (keys['arrowup']) dy -= 1;
  if (keys['arrowdown']) dy += 1;
  if (keys['arrowleft']) dx -= 1;
  if (keys['arrowright']) dx += 1;
  const usingArrows = dx !== 0 || dy !== 0;

  if (usingArrows) {
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const step = princess.speed * dt;
    const tryX = princess.x + dx * step;
    const tryY = princess.y + dy * step;
    if (canMoveTo(tryX, princess.y, princess.r)) princess.x = tryX;
    if (canMoveTo(princess.x, tryY, princess.r)) princess.y = tryY;
    princess.facing = Math.atan2(dy, dx);
    princess.bob += dt * 10;
  } else if (princess.path.length) {
    const next = princess.path[0];
    const ddx = next.x - princess.x;
    const ddy = next.y - princess.y;
    const dist = Math.hypot(ddx, ddy);
    const step = princess.speed * dt;
    if (dist <= step) {
      princess.x = next.x; princess.y = next.y;
      princess.path.shift();
    } else {
      princess.x += (ddx/dist) * step;
      princess.y += (ddy/dist) * step;
      princess.facing = Math.atan2(ddy, ddx);
      princess.bob += dt * 8;
    }
  }

  if (!panned) {
    camera.x += (princess.x - camera.x) * 0.08;
    camera.y += (princess.y - camera.y) * 0.08;
  }

  // Dress pads (level 1)
  for (const pad of dressPads) {
    pad.spin += dt * 2;
    const px = (pad.cx+0.5)*TILE, py = (pad.cy+0.5)*TILE;
    if (Math.hypot(px - princess.x, py - princess.y) < princess.r + 14) {
      if (princess.dress.name !== pad.color.name) {
        princess.dress = pad.color;
        sparkles.push({x: princess.x, y: princess.y, t:0});
      }
    }
  }

  // Flowers spin
  for (const f of flowers) f.spin += dt * 18;

  // Gems
  for (const g of gems) {
    if (g.collected) continue;
    g.spin += dt * 3;
    const gx = (g.cx+0.5)*TILE, gy = (g.cy+0.5)*TILE;
    if (Math.hypot(gx - princess.x, gy - princess.y) < princess.r + 10) {
      g.collected = true;
      sparkles.push({x:gx, y:gy, t:0});
    }
  }

  // Gates — find active
  let nearGate = null;
  let nearestDist = Infinity;
  for (const gate of gates) {
    if (gate.open) continue;
    gate.shake = Math.max(0, gate.shake - dt);
    const gx = (gate.cx+0.5)*TILE, gy = (gate.cy+0.5)*TILE;
    const d = Math.hypot(gx - princess.x, gy - princess.y);
    if (d < TILE*1.6 && d < nearestDist) { nearGate = gate; nearestDist = d; }
  }
  if (nearGate !== activeGate) {
    if (activeGate) activeGate.typed = '';
    activeGate = nearGate;
  }
  const gatePrompt = document.getElementById('gatePrompt');
  if (activeGate && !activeGate.open) {
    const ch = activeGate.challenge;
    let html = `<span class="q">${ch.question}</span>`;
    if (ch.type === 'math') {
      html += `<span class="sub">Type the answer (digits 0–9)${activeGate.typed ? ' — typed: '+activeGate.typed : ''}</span>`;
    } else {
      html += `<span class="sub">Press the letter on your keyboard</span>`;
    }
    gatePrompt.innerHTML = html;
    gatePrompt.style.display = 'block';
  } else {
    gatePrompt.style.display = 'none';
  }

  // Spin attack
  if (spinAttack) {
    spinAttack.t += dt;
    const radius = TILE * 1.4 * (spinAttack.t / spinAttack.duration);
    for (const gh of ghosts) {
      if (!gh.alive) continue;
      if (Math.hypot(gh.x - princess.x, gh.y - princess.y) < radius) {
        killGhost(gh);
      }
    }
    if (spinAttack.t >= spinAttack.duration) spinAttack = null;
  }

  // Fireballs
  for (const f of fireballs) {
    f.life += dt;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    // Wall collision
    const cx = Math.floor(f.x/TILE), cy = Math.floor(f.y/TILE);
    if (cx<0||cy<0||cx>=COLS||cy>=ROWS||maze[cy][cx]===1) { f.life = f.maxLife; continue; }
    // Ghost damage
    for (const gh of ghosts) {
      if (!gh.alive) continue;
      if (Math.hypot(gh.x - f.x, gh.y - f.y) < gh.r + f.size) {
        killGhost(gh);
        f.life = f.maxLife;
      }
    }
  }
  for (let i = fireballs.length-1; i >= 0; i--) if (fireballs[i].life >= fireballs[i].maxLife) fireballs.splice(i,1);

  // Ghosts
  for (const gh of ghosts) {
    if (!gh.alive) {
      gh.deathT += dt;
      continue;
    }
    gh.repathTimer -= dt;
    gh.bob += dt * 2;
    gh.waveTimer = Math.max(0, gh.waveTimer - dt);

    const distToP = Math.hypot(princess.x - gh.x, princess.y - gh.y);
    const aggro = gh.hostile && distToP < TILE * 6;

    if (gh.path.length === 0 || gh.repathTimer <= 0) {
      const ecx = Math.floor(gh.x / TILE), ecy = Math.floor(gh.y / TILE);
      let tx, ty;
      if (aggro) {
        tx = Math.floor(princess.x / TILE);
        ty = Math.floor(princess.y / TILE);
      } else {
        let tries = 0;
        do {
          tx = 1 + Math.floor(Math.random()*(COLS-2));
          ty = 1 + Math.floor(Math.random()*(ROWS-2));
          tries++;
        } while (maze[ty][tx] === 1 && tries < 10);
      }
      const p = aStar(ecx, ecy, tx, ty);
      if (p && p.length > 1) {
        gh.path = p.slice(1).map(([x,y]) => ({x:(x+0.5)*TILE, y:(y+0.5)*TILE}));
      }
      gh.repathTimer = aggro ? 0.5 : 3 + Math.random()*3;
    }

    if (gh.path.length) {
      const next = gh.path[0];
      const ddx = next.x - gh.x, ddy = next.y - gh.y;
      const dist = Math.hypot(ddx, ddy);
      const sp = aggro ? gh.speed * 1.3 : gh.speed;
      const step = sp * dt;
      if (dist <= step) {
        gh.x = next.x; gh.y = next.y;
        gh.path.shift();
      } else {
        gh.x += (ddx/dist)*step;
        gh.y += (ddy/dist)*step;
      }
    }

    if (!gh.hostile && distToP < TILE * 1.4 && gh.waveTimer <= 0) {
      gh.waveTimer = 3;
      hearts.push({ x: gh.x, y: gh.y - gh.r, t: 0 });
    }

    // Harmful contact (level 3)
    if (gh.hostile && distToP < princess.r + gh.r - 6 && princess.hurtFlash <= 0) {
      princess.hurtFlash = 0.6;
      // knockback
      const a = Math.atan2(princess.y - gh.y, princess.x - gh.x);
      const pushX = princess.x + Math.cos(a) * TILE * 0.8;
      const pushY = princess.y + Math.sin(a) * TILE * 0.8;
      if (canMoveTo(pushX, pushY, princess.r)) {
        princess.x = pushX; princess.y = pushY;
      }
      princess.hits = (princess.hits || 0) + 1;
      if (princess.hits >= 3) endGame(false);
    }
  }

  // Clean dead ghosts after poof finishes
  for (let i = ghosts.length-1; i >= 0; i--) if (!ghosts[i].alive && ghosts[i].deathT > 1) ghosts.splice(i,1);

  // Goal check
  const goalX = (goalCastle.cx+0.5)*TILE, goalY = (goalCastle.cy+0.5)*TILE;
  if (Math.hypot(goalX - princess.x, goalY - princess.y) < princess.r + 14) {
    const allGems = gems.every(g => g.collected);
    if (allGems) {
      if (level < 3) nextLevel();
      else endGame(true);
    }
  }

  // Effects
  for (const r of ripples) r.t += dt;
  for (let i = ripples.length-1; i >= 0; i--) if (ripples[i].t > 0.8) ripples.splice(i,1);
  for (const s of sparkles) s.t += dt;
  for (let i = sparkles.length-1; i >= 0; i--) if (sparkles[i].t > 0.6) sparkles.splice(i,1);
  for (const h of hearts) h.t += dt;
  for (let i = hearts.length-1; i >= 0; i--) if (hearts[i].t > 1.5) hearts.splice(i,1);
  for (const p of poofs) p.t += dt;
  for (let i = poofs.length-1; i >= 0; i--) if (poofs[i].t > 0.8) poofs.splice(i,1);

  if (levelBannerTimer > 0) {
    levelBannerTimer -= dt;
    if (levelBannerTimer <= 0) document.getElementById('levelBanner').style.display = 'none';
  }
}

function killGhost(gh) {
  gh.alive = false;
  poofs.push({ x: gh.x, y: gh.y, t: 0, color: gh.color });
}

function nextLevel() {
  level++;
  generateMaze();
  initEntities();
  camera.x = princess.x; camera.y = princess.y;
  fireballs.length = 0;
  spinAttack = null;
  princess.hits = 0;
  showLevelBanner();
  document.getElementById('levelNum').textContent = level;
  document.getElementById('fireRow').style.display = level >= 2 ? 'block' : 'none';
}

function showLevelBanner() {
  const banner = document.getElementById('levelBanner');
  const titles = {
    1: { t: 'Level 1 — Flewer Kingdom', s: 'Walk through dress pads! Press T to spin attack!' },
    2: { t: 'Level 2 — Dragon Realm 🐲', s: 'You ride a dragon! Press Z for fire. Solve math at gates.' },
    3: { t: 'Level 3 — Shadow Castle 👻', s: 'The ghosts turned hostile! Letter & math gates ahead.' }
  };
  const info = titles[level];
  banner.innerHTML = `${info.t}<span class="sub">${info.s}</span>`;
  banner.style.display = 'block';
  levelBannerTimer = 3.5;
}

function endGame(win) {
  gameOver = true;
  const msg = document.getElementById('message');
  document.getElementById('msgTitle').textContent = win ? '👑 You Saved the Kingdom!' : '💔 The shadows won…';
  document.getElementById('msgBody').textContent = win
    ? `You conquered all three kingdoms in ${gameTime.toFixed(1)}s!`
    : `The hostile ghosts caught you. Try again!`;
  msg.style.display = 'block';
}

function restart() {
  document.getElementById('message').style.display = 'none';
  level = 1;
  fireballs.length = 0;
  spinAttack = null;
  generateMaze();
  initEntities();
  camera.x = princess.x; camera.y = princess.y;
  camera.zoom = 1;
  gameTime = 0;
  gameOver = false;
  document.getElementById('levelNum').textContent = level;
  document.getElementById('fireRow').style.display = 'none';
  showLevelBanner();
}
window.restart = restart;

/* ---------- Drawing helpers ---------- */
function drawCastle(cx, cy, scale, palette) {
  ctx.save();
  ctx.translate(cx, cy);
  const s = scale;
  const grad = ctx.createRadialGradient(0,0,0, 0,0,s*2.5);
  grad.addColorStop(0, 'rgba(255, 240, 180, 0.55)');
  grad.addColorStop(1, 'rgba(255, 240, 180, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(-s*2.5, -s*2.5, s*5, s*5);
  ctx.fillStyle = palette.main;
  ctx.fillRect(-s*0.9, -s*0.3, s*1.8, s*1.3);
  for (let i = -3; i <= 3; i++) ctx.fillRect(i*s*0.25 - s*0.1, -s*0.45, s*0.18, s*0.15);
  ctx.fillStyle = palette.highlight;
  ctx.fillRect(-s*1.0, -s*0.7, s*0.35, s*1.7);
  ctx.fillRect(s*0.65, -s*0.7, s*0.35, s*1.7);
  for (let i = 0; i < 3; i++) {
    ctx.fillRect(-s*1.0 + i*s*0.14, -s*0.82, s*0.1, s*0.12);
    ctx.fillRect(s*0.65 + i*s*0.14, -s*0.82, s*0.1, s*0.12);
  }
  ctx.fillStyle = palette.flag;
  ctx.beginPath(); ctx.moveTo(-s*1.05, -s*0.7); ctx.lineTo(-s*0.65, -s*0.7); ctx.lineTo(-s*0.85, -s*1.1); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(s*0.6, -s*0.7); ctx.lineTo(s*1.0, -s*0.7); ctx.lineTo(s*0.8, -s*1.1); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s*0.6, -s*0.45); ctx.lineTo(s*0.6, -s*0.45); ctx.lineTo(0, -s*0.95); ctx.closePath(); ctx.fill();
  ctx.fillStyle = palette.highlight;
  ctx.fillRect(-s*0.87, -s*1.25, s*0.04, s*0.2);
  ctx.fillRect(s*0.78, -s*1.25, s*0.04, s*0.2);
  ctx.fillStyle = palette.flag;
  ctx.beginPath(); ctx.moveTo(-s*0.85, -s*1.25); ctx.lineTo(-s*0.7, -s*1.18); ctx.lineTo(-s*0.85, -s*1.1); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(s*0.8, -s*1.25); ctx.lineTo(s*0.95, -s*1.18); ctx.lineTo(s*0.8, -s*1.1); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5a8cd0';
  ctx.fillRect(-s*0.9, -s*0.15, s*0.18, s*0.25);
  ctx.fillRect(s*0.72, -s*0.15, s*0.18, s*0.25);
  ctx.fillStyle = palette.door;
  ctx.beginPath();
  ctx.moveTo(-s*0.22, s*1.0);
  ctx.lineTo(-s*0.22, s*0.3);
  ctx.quadraticCurveTo(0, s*0.1, s*0.22, s*0.3);
  ctx.lineTo(s*0.22, s*1.0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function levelTheme() {
  if (level === 1) return { sky1:'#bde6ff', sky2:'#ffe8d6', wall1:'#6fbf5f', wall2:'#8dd278', wallAcc:'#5aa84c', floor1:'#cfeaa0', floor2:'#d9f0b0', tuft:'#8fbf4f' };
  if (level === 2) return { sky1:'#ffd6a0', sky2:'#ff9c7a', wall1:'#a86a40', wall2:'#c48a5a', wallAcc:'#7a4828', floor1:'#e8c896', floor2:'#f0d4a8', tuft:'#b47a40' };
  return { sky1:'#2a1a4a', sky2:'#4a2a5a', wall1:'#3a2a5a', wall2:'#4a3a6a', wallAcc:'#2a1a3a', floor1:'#4a3a5a', floor2:'#52425a', tuft:'#7a5a8a' };
}

/* ---------- Rendering ---------- */
function drawMaze() {
  const theme = levelTheme();
  const viewL = camera.x - canvas.width/(2*camera.zoom);
  const viewR = camera.x + canvas.width/(2*camera.zoom);
  const viewT = camera.y - canvas.height/(2*camera.zoom);
  const viewB = camera.y + canvas.height/(2*camera.zoom);

  const x0 = Math.max(0, Math.floor(viewL / TILE) - 1);
  const x1 = Math.min(COLS, Math.ceil(viewR / TILE) + 1);
  const y0 = Math.max(0, Math.floor(viewT / TILE) - 1);
  const y1 = Math.min(ROWS, Math.ceil(viewB / TILE) + 1);

  for (let y = y0; y < y1; y++) {
    for (let x = x0; x < x1; x++) {
      const sx = worldToScreen(x * TILE, y * TILE);
      const size = TILE * camera.zoom;
      if (maze[y][x] === 1) {
        ctx.fillStyle = theme.wall1;
        ctx.fillRect(sx.x, sx.y, size+1, size+1);
        ctx.fillStyle = theme.wall2;
        ctx.fillRect(sx.x+2, sx.y+2, size-4, size-4);
        ctx.fillStyle = theme.wallAcc;
        ctx.beginPath(); ctx.arc(sx.x + size*0.3, sx.y + size*0.3, size*0.08, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(sx.x + size*0.7, sx.y + size*0.6, size*0.08, 0, Math.PI*2); ctx.fill();
        if (level === 1 && (x*7+y*3) % 5 === 0) {
          ctx.fillStyle = '#ff9cc7';
          ctx.beginPath(); ctx.arc(sx.x + size*0.65, sx.y + size*0.3, size*0.06, 0, Math.PI*2); ctx.fill();
        }
        if (level === 3 && (x*7+y*3) % 8 === 0) {
          ctx.fillStyle = '#8a5aa0';
          ctx.beginPath(); ctx.arc(sx.x + size*0.5, sx.y + size*0.5, size*0.05, 0, Math.PI*2); ctx.fill();
        }
      } else {
        const dark = (x+y) % 2 === 0;
        ctx.fillStyle = dark ? theme.floor1 : theme.floor2;
        ctx.fillRect(sx.x, sx.y, size+1, size+1);
        if ((x*13+y*7) % 9 === 0) {
          ctx.strokeStyle = theme.tuft;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(sx.x + size*0.5, sx.y + size*0.6); ctx.lineTo(sx.x + size*0.5, sx.y + size*0.8);
          ctx.moveTo(sx.x + size*0.45, sx.y + size*0.65); ctx.lineTo(sx.x + size*0.45, sx.y + size*0.8);
          ctx.moveTo(sx.x + size*0.55, sx.y + size*0.65); ctx.lineTo(sx.x + size*0.55, sx.y + size*0.8);
          ctx.stroke();
        }
      }
    }
  }

  // Flowers
  for (const f of flowers) {
    const s = worldToScreen(f.x, f.y);
    const r = TILE * f.size * camera.zoom;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(f.spin);
    ctx.fillStyle = f.color;
    for (let i = 0; i < 5; i++) {
      const a = i * Math.PI*2/5;
      ctx.beginPath();
      ctx.arc(Math.cos(a)*r*0.6, Math.sin(a)*r*0.6, r*0.5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath(); ctx.arc(0, 0, r*0.45, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Start castle
  const startS = worldToScreen((startCastle.cx+0.5)*TILE, (startCastle.cy+0.5)*TILE);
  drawCastle(startS.x, startS.y, TILE * 0.55 * camera.zoom, {
    main: '#e8d4ff', highlight: '#c9a0ff', flag: '#ff9cc7', door: '#a86a3a'
  });

  // Goal castle
  const goalS = worldToScreen((goalCastle.cx+0.5)*TILE, (goalCastle.cy+0.5)*TILE);
  const pulse = 1 + 0.08 * Math.sin(gameTime * 3);
  const goalPalette = level === 3
    ? { main:'#3a2a5a', highlight:'#6a4a8a', flag:'#ff5a9c', door:'#1a0a2a' }
    : { main:'#fff3c0', highlight:'#ffd86b', flag:'#ff5a9c', door:'#8a5a2a' };
  drawCastle(goalS.x, goalS.y, TILE * 0.6 * camera.zoom * pulse, goalPalette);
}

function drawDressPads() {
  for (const pad of dressPads) {
    const s = worldToScreen((pad.cx+0.5)*TILE, (pad.cy+0.5)*TILE);
    const r = TILE * 0.32 * camera.zoom;
    ctx.save();
    ctx.translate(s.x, s.y);
    // ring base
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(0, 0, r*1.1, 0, Math.PI*2); ctx.fill();
    // rotating petals
    for (let i = 0; i < 6; i++) {
      const a = pad.spin + i * Math.PI/3;
      ctx.fillStyle = pad.color.main;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a)*r*0.6, Math.sin(a)*r*0.6, r*0.35, r*0.2, a, 0, Math.PI*2);
      ctx.fill();
    }
    // tiny mini-dress icon
    ctx.fillStyle = pad.color.main;
    ctx.beginPath();
    ctx.moveTo(-r*0.25, r*0.2); ctx.lineTo(-r*0.12, -r*0.15);
    ctx.lineTo(r*0.12, -r*0.15); ctx.lineTo(r*0.25, r*0.2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = pad.color.accent;
    ctx.beginPath(); ctx.arc(0, r*0.05, r*0.05, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawGates() {
  for (const gate of gates) {
    if (gate.open) continue;
    const s = worldToScreen((gate.cx+0.5)*TILE, (gate.cy+0.5)*TILE);
    const size = TILE * camera.zoom;
    const shakeX = gate.shake > 0 ? Math.sin(gameTime * 40) * 3 : 0;
    ctx.save();
    ctx.translate(s.x + shakeX, s.y);

    // gate posts
    ctx.fillStyle = level === 3 ? '#4a2a5a' : '#8a5a2a';
    if (gate.horiz) {
      ctx.fillRect(-size*0.5, -size*0.5, size*0.15, size);
      ctx.fillRect(size*0.35, -size*0.5, size*0.15, size);
      // gate bars
      ctx.fillStyle = level === 3 ? '#6a4a8a' : '#c8a878';
      ctx.fillRect(-size*0.5, -size*0.1, size, size*0.15);
    } else {
      ctx.fillRect(-size*0.5, -size*0.5, size, size*0.15);
      ctx.fillRect(-size*0.5, size*0.35, size, size*0.15);
      ctx.fillStyle = level === 3 ? '#6a4a8a' : '#c8a878';
      ctx.fillRect(-size*0.1, -size*0.5, size*0.15, size);
    }
    // padlock glow
    ctx.fillStyle = level === 3 ? 'rgba(255,100,255,0.6)' : 'rgba(255,220,100,0.7)';
    ctx.beginPath(); ctx.arc(0, 0, size*0.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.floor(size*0.22)}px Segoe UI`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', 0, 0);
    ctx.restore();

    // Floating question above
    const qY = s.y - size * 0.8;
    ctx.save();
    ctx.fillStyle = 'rgba(255, 250, 245, 0.95)';
    ctx.strokeStyle = '#ff9cc7';
    ctx.lineWidth = 2;
    const label = gate.challenge.type === 'letter' ? gate.challenge.display : gate.challenge.question;
    ctx.font = `bold ${Math.floor(size*0.28)}px Segoe UI`;
    const w = ctx.measureText(label).width + size*0.3;
    const h = size*0.45;
    ctx.beginPath();
    ctx.roundRect(s.x - w/2, qY - h/2, w, h, 8);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#b4337a';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, s.x, qY);
    ctx.restore();
  }
}

function drawGems() {
  for (const g of gems) {
    if (g.collected) continue;
    const s = worldToScreen((g.cx+0.5)*TILE, (g.cy+0.5)*TILE);
    const r = TILE * 0.25 * camera.zoom;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(g.spin);
    const glow = ctx.createRadialGradient(0,0,0,0,0,r*2);
    glow.addColorStop(0,'rgba(255, 200, 240, 0.7)');
    glow.addColorStop(1,'rgba(255, 200, 240, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0,0,r*2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff5a9c';
    ctx.beginPath();
    ctx.moveTo(0, r*0.7);
    ctx.bezierCurveTo(r, r*0.2, r, -r*0.5, 0, -r*0.1);
    ctx.bezierCurveTo(-r, -r*0.5, -r, r*0.2, 0, r*0.7);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffc2de';
    ctx.beginPath(); ctx.ellipse(-r*0.3, -r*0.2, r*0.2, r*0.15, -0.4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawDragon(r) {
  // Drawn centered beneath princess. r is princess radius.
  const bob = Math.sin(princess.bob * 0.7) * 2;
  ctx.save();
  ctx.translate(0, bob);

  // body shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0, r*1.3, r*1.6, r*0.35, 0, 0, Math.PI*2); ctx.fill();

  // wings
  ctx.fillStyle = '#6a2a8a';
  const wingFlap = Math.sin(gameTime * 8) * 0.3;
  ctx.save();
  ctx.translate(-r*0.5, -r*0.1);
  ctx.rotate(-0.4 + wingFlap);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-r*1.2, -r*0.6, -r*1.6, r*0.2);
  ctx.quadraticCurveTo(-r*0.8, r*0.1, 0, r*0.4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8a4aa8';
  ctx.beginPath();
  ctx.moveTo(0, r*0.1);
  ctx.quadraticCurveTo(-r*0.8, -r*0.2, -r*1.3, r*0.15);
  ctx.quadraticCurveTo(-r*0.6, r*0.15, 0, r*0.3);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(r*0.5, -r*0.1);
  ctx.rotate(0.4 - wingFlap);
  ctx.fillStyle = '#6a2a8a';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(r*1.2, -r*0.6, r*1.6, r*0.2);
  ctx.quadraticCurveTo(r*0.8, r*0.1, 0, r*0.4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8a4aa8';
  ctx.beginPath();
  ctx.moveTo(0, r*0.1);
  ctx.quadraticCurveTo(r*0.8, -r*0.2, r*1.3, r*0.15);
  ctx.quadraticCurveTo(r*0.6, r*0.15, 0, r*0.3);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // body
  ctx.fillStyle = '#8a3aa8';
  ctx.beginPath();
  ctx.ellipse(0, r*0.5, r*1.1, r*0.7, 0, 0, Math.PI*2);
  ctx.fill();
  // belly
  ctx.fillStyle = '#c98adc';
  ctx.beginPath();
  ctx.ellipse(0, r*0.75, r*0.7, r*0.4, 0, 0, Math.PI*2);
  ctx.fill();

  // tail
  ctx.fillStyle = '#8a3aa8';
  ctx.beginPath();
  ctx.moveTo(r*0.4, r*0.9);
  ctx.quadraticCurveTo(r*1.4, r*1.2, r*1.3, r*0.3);
  ctx.quadraticCurveTo(r*1.1, r*0.9, r*0.3, r*1.1);
  ctx.closePath(); ctx.fill();
  // tail tip
  ctx.fillStyle = '#ff5a9c';
  ctx.beginPath();
  ctx.moveTo(r*1.3, r*0.35);
  ctx.lineTo(r*1.55, r*0.2);
  ctx.lineTo(r*1.4, r*0.15);
  ctx.lineTo(r*1.55, r*0.0);
  ctx.lineTo(r*1.3, r*0.1);
  ctx.closePath(); ctx.fill();

  // head
  ctx.fillStyle = '#8a3aa8';
  ctx.beginPath();
  ctx.ellipse(0, -r*0.15, r*0.55, r*0.45, 0, 0, Math.PI*2);
  ctx.fill();
  // snout
  ctx.fillStyle = '#a04ac8';
  ctx.beginPath();
  ctx.ellipse(0, -r*0.05, r*0.35, r*0.25, 0, 0, Math.PI*2);
  ctx.fill();
  // nostrils
  ctx.fillStyle = '#3a1a4a';
  ctx.beginPath(); ctx.arc(-r*0.1, -r*0.02, r*0.04, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.1, -r*0.02, r*0.04, 0, Math.PI*2); ctx.fill();
  // eyes (friendly)
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-r*0.2, -r*0.25, r*0.08, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.2, -r*0.25, r*0.08, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3a1a4a';
  ctx.beginPath(); ctx.arc(-r*0.18, -r*0.24, r*0.04, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.22, -r*0.24, r*0.04, 0, Math.PI*2); ctx.fill();
  // horns
  ctx.fillStyle = '#e8d8f0';
  ctx.beginPath(); ctx.moveTo(-r*0.35, -r*0.45); ctx.lineTo(-r*0.5, -r*0.75); ctx.lineTo(-r*0.25, -r*0.5); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(r*0.35, -r*0.45); ctx.lineTo(r*0.5, -r*0.75); ctx.lineTo(r*0.25, -r*0.5); ctx.closePath(); ctx.fill();
  // back spikes
  ctx.fillStyle = '#ff5a9c';
  for (let i = 0; i < 3; i++) {
    const sx = i*r*0.3 - r*0.1;
    ctx.beginPath();
    ctx.moveTo(sx, r*0.2);
    ctx.lineTo(sx + r*0.1, -r*0.05);
    ctx.lineTo(sx + r*0.2, r*0.2);
    ctx.closePath(); ctx.fill();
  }

  ctx.restore();
}

function drawPrincess() {
  const s = worldToScreen(princess.x, princess.y);
  const r = princess.r * camera.zoom;
  const bob = Math.sin(princess.bob) * 2 * camera.zoom;
  const dress = princess.dress;

  ctx.save();
  ctx.translate(s.x, s.y + bob);

  if (princess.hurtFlash > 0 && Math.floor(princess.hurtFlash*10) % 2 === 0) {
    ctx.filter = 'brightness(2) hue-rotate(-30deg)';
  }

  // Shadow (smaller — dragon has its own)
  if (!princess.onDragon) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(0, r*0.9, r*0.9, r*0.3, 0, 0, Math.PI*2); ctx.fill();
  }

  // Dragon first (below princess)
  if (princess.onDragon) drawDragon(r * 0.75);

  // Offset princess upward when on dragon
  const yOff = princess.onDragon ? -r*0.3 : 0;
  ctx.translate(0, yOff);
  const pr = princess.onDragon ? r * 0.7 : r;

  // dress
  ctx.fillStyle = dress.main;
  ctx.beginPath();
  ctx.moveTo(-pr*0.95, pr*0.95);
  ctx.lineTo(-pr*0.4, -pr*0.1);
  ctx.lineTo(pr*0.4, -pr*0.1);
  ctx.lineTo(pr*0.95, pr*0.95);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = dress.light;
  ctx.beginPath();
  ctx.moveTo(-pr*0.4, -pr*0.1); ctx.lineTo(pr*0.4, -pr*0.1);
  ctx.lineTo(pr*0.15, pr*0.3); ctx.lineTo(-pr*0.15, pr*0.3);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = dress.accent;
  ctx.fillRect(-pr*0.45, -pr*0.1, pr*0.9, pr*0.12);

  // diamonds on dress
  function diamond(dx, dy, size, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(dx, dy - size); ctx.lineTo(dx + size*0.7, dy);
    ctx.lineTo(dx, dy + size); ctx.lineTo(dx - size*0.7, dy);
    ctx.closePath(); ctx.fill();
  }
  diamond(0, pr*0.35, pr*0.14, dress.accent);
  diamond(-pr*0.35, pr*0.65, pr*0.12, dress.accent);
  diamond(pr*0.35, pr*0.65, pr*0.12, dress.accent);

  // arms
  ctx.fillStyle = dress.main;
  ctx.beginPath(); ctx.arc(-pr*0.5, pr*0.05, pr*0.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(pr*0.5, pr*0.05, pr*0.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffe0c2';
  ctx.beginPath(); ctx.arc(-pr*0.55, pr*0.2, pr*0.1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(pr*0.55, pr*0.2, pr*0.1, 0, Math.PI*2); ctx.fill();

  // head
  ctx.fillStyle = '#ffe0c2';
  ctx.beginPath(); ctx.arc(0, -pr*0.4, pr*0.45, 0, Math.PI*2); ctx.fill();

  // hair
  ctx.fillStyle = '#c77d2a';
  ctx.beginPath(); ctx.arc(0, -pr*0.55, pr*0.52, Math.PI, 0); ctx.fill();
  ctx.fillRect(-pr*0.52, -pr*0.55, pr*1.04, pr*0.3);
  ctx.beginPath();
  ctx.moveTo(-pr*0.52, -pr*0.4); ctx.quadraticCurveTo(-pr*0.7, pr*0.1, -pr*0.4, pr*0.2);
  ctx.lineTo(-pr*0.3, pr*0.05); ctx.quadraticCurveTo(-pr*0.4, -pr*0.2, -pr*0.35, -pr*0.3);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(pr*0.52, -pr*0.4); ctx.quadraticCurveTo(pr*0.7, pr*0.1, pr*0.4, pr*0.2);
  ctx.lineTo(pr*0.3, pr*0.05); ctx.quadraticCurveTo(pr*0.4, -pr*0.2, pr*0.35, -pr*0.3);
  ctx.closePath(); ctx.fill();

  // crown
  ctx.fillStyle = '#ffd24a';
  ctx.beginPath();
  ctx.moveTo(-pr*0.45, -pr*0.75);
  ctx.lineTo(-pr*0.3, -pr*1.0);
  ctx.lineTo(-pr*0.1, -pr*0.82);
  ctx.lineTo(0, -pr*1.05);
  ctx.lineTo(pr*0.1, -pr*0.82);
  ctx.lineTo(pr*0.3, -pr*1.0);
  ctx.lineTo(pr*0.45, -pr*0.75);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff5a9c';
  ctx.beginPath(); ctx.arc(0, -pr*0.88, pr*0.08, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#4da6ff';
  ctx.beginPath(); ctx.arc(-pr*0.25, -pr*0.82, pr*0.05, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(pr*0.25, -pr*0.82, pr*0.05, 0, Math.PI*2); ctx.fill();

  // eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-pr*0.15, -pr*0.38, pr*0.09, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(pr*0.15, -pr*0.38, pr*0.09, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3a4a8a';
  ctx.beginPath(); ctx.arc(-pr*0.13, -pr*0.36, pr*0.05, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(pr*0.17, -pr*0.36, pr*0.05, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-pr*0.11, -pr*0.38, pr*0.02, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(pr*0.19, -pr*0.38, pr*0.02, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = 'rgba(255, 150, 180, 0.6)';
  ctx.beginPath(); ctx.arc(-pr*0.28, -pr*0.25, pr*0.08, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(pr*0.28, -pr*0.25, pr*0.08, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = '#b4337a';
  ctx.lineWidth = pr*0.07;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, -pr*0.25, pr*0.1, 0.1, Math.PI - 0.1); ctx.stroke();

  ctx.filter = 'none';

  // selection ring
  ctx.strokeStyle = 'rgba(255, 150, 200, 0.7)';
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 4]);
  ctx.lineDashOffset = -gameTime * 20;
  ctx.translate(0, -yOff);
  ctx.beginPath(); ctx.arc(0, r*0.9, r*1.15, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);

  ctx.restore();

  // Spin attack effect on top
  if (spinAttack) {
    const progress = spinAttack.t / spinAttack.duration;
    const radius = TILE * 1.4 * progress * camera.zoom;
    const ss = worldToScreen(princess.x, princess.y);
    ctx.save();
    ctx.translate(ss.x, ss.y);
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI/4 + progress * 10;
      ctx.fillStyle = `rgba(255, 220, 100, ${1-progress})`;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a)*radius, Math.sin(a)*radius, 8, 16, a, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.strokeStyle = `rgba(255, 200, 240, ${1-progress})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

function drawGhosts() {
  for (const gh of ghosts) {
    const s = worldToScreen(gh.x, gh.y);
    const r = gh.r * camera.zoom;

    if (!gh.alive) {
      // poof fade
      const a = 1 - gh.deathT;
      if (a <= 0) continue;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.globalAlpha = a;
      ctx.fillStyle = gh.color;
      ctx.beginPath(); ctx.arc(0, 0, r * (1 + gh.deathT), 0, Math.PI*2); ctx.fill();
      ctx.restore();
      continue;
    }

    const bobY = Math.sin(gh.bob) * 3 * camera.zoom;
    ctx.save();
    ctx.translate(s.x, s.y + bobY);

    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(0, r*1.0, r*0.7, r*0.2, 0, 0, Math.PI*2); ctx.fill();

    // body
    ctx.fillStyle = gh.color;
    ctx.beginPath();
    ctx.arc(0, -r*0.2, r*0.9, Math.PI, 0);
    ctx.lineTo(r*0.9, r*0.7);
    for (let i = 0; i < 4; i++) {
      const t1 = r*0.9 - (i*2+1)*r*0.225;
      const t2 = r*0.9 - (i*2+2)*r*0.225;
      ctx.quadraticCurveTo(t1 + r*0.1125, r*0.9, t1, r*0.7);
      ctx.quadraticCurveTo(t2 + r*0.1125, r*0.5, t2, r*0.7);
    }
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = gh.hostile ? 'rgba(255, 50, 100, 0.6)' : 'rgba(150, 120, 180, 0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();

    if (gh.hostile) {
      // Angry eyes
      ctx.fillStyle = '#ff3366';
      ctx.beginPath(); ctx.arc(-r*0.3, -r*0.25, r*0.15, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.3, -r*0.25, r*0.15, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffdd00';
      ctx.beginPath(); ctx.arc(-r*0.3, -r*0.25, r*0.06, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.3, -r*0.25, r*0.06, 0, Math.PI*2); ctx.fill();
      // angry mouth
      ctx.strokeStyle = '#ff3366';
      ctx.lineWidth = r*0.1;
      ctx.beginPath(); ctx.arc(0, r*0.1, r*0.18, Math.PI + 0.1, -0.1); ctx.stroke();
      // angry brows
      ctx.strokeStyle = '#2a0a2a';
      ctx.lineWidth = r*0.1;
      ctx.beginPath();
      ctx.moveTo(-r*0.5, -r*0.45); ctx.lineTo(-r*0.15, -r*0.3);
      ctx.moveTo(r*0.5, -r*0.45); ctx.lineTo(r*0.15, -r*0.3);
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#5a3a70';
      ctx.lineWidth = r*0.12;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(-r*0.3, -r*0.25, r*0.15, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(r*0.3, -r*0.25, r*0.15, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
      ctx.strokeStyle = '#b47aa0';
      ctx.lineWidth = r*0.08;
      ctx.beginPath(); ctx.arc(0, -r*0.05, r*0.18, 0.1, Math.PI - 0.1); ctx.stroke();
      ctx.fillStyle = 'rgba(255, 150, 180, 0.5)';
      ctx.beginPath(); ctx.arc(-r*0.5, -r*0.05, r*0.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.5, -r*0.05, r*0.1, 0, Math.PI*2); ctx.fill();
      if (gh.waveTimer > 1.5) {
        const waveA = Math.sin(gameTime * 12) * 0.4;
        ctx.save();
        ctx.translate(r*0.7, -r*0.3);
        ctx.rotate(waveA);
        ctx.fillStyle = gh.color;
        ctx.beginPath(); ctx.arc(0, 0, r*0.18, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(150, 120, 180, 0.4)';
        ctx.stroke();
        ctx.restore();
      }
    }
    ctx.restore();
  }
}

function drawFireballs() {
  for (const f of fireballs) {
    const s = worldToScreen(f.x, f.y);
    const prog = f.life / f.maxLife;
    const sz = f.size * camera.zoom * (1 - prog*0.3);
    ctx.save();
    ctx.translate(s.x, s.y);
    const grad = ctx.createRadialGradient(0,0,0,0,0,sz*2);
    grad.addColorStop(0, `rgba(255, 255, 200, ${1-prog})`);
    grad.addColorStop(0.4, `rgba(255, 180, 60, ${1-prog})`);
    grad.addColorStop(1, `rgba(255, 80, 40, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0, 0, sz*2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = `rgba(255, 220, 100, ${1-prog})`;
    ctx.beginPath(); ctx.arc(0, 0, sz*0.6, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawPath() {
  if (!princess.path.length) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 150, 200, 0.8)';
  ctx.lineWidth = 3;
  ctx.setLineDash([6, 8]);
  ctx.lineDashOffset = -gameTime * 30;
  ctx.beginPath();
  const ps = worldToScreen(princess.x, princess.y);
  ctx.moveTo(ps.x, ps.y);
  for (const p of princess.path) {
    const s = worldToScreen(p.x, p.y);
    ctx.lineTo(s.x, s.y);
  }
  ctx.stroke();
  ctx.restore();
}

function drawEffects() {
  for (const r of ripples) {
    const s = worldToScreen(r.x, r.y);
    const a = 1 - r.t / 0.8;
    const rad = 10 + r.t * 40;
    ctx.strokeStyle = `rgba(255, 150, 200, ${a})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s.x, s.y, rad * camera.zoom, 0, Math.PI*2); ctx.stroke();
  }
  for (const sp of sparkles) {
    const s = worldToScreen(sp.x, sp.y);
    const a = 1 - sp.t / 0.6;
    for (let i = 0; i < 6; i++) {
      const ang = i * Math.PI/3 + sp.t*5;
      const d = sp.t * 60 * camera.zoom;
      ctx.fillStyle = `rgba(255, 180, 220, ${a})`;
      ctx.beginPath();
      ctx.arc(s.x + Math.cos(ang)*d, s.y + Math.sin(ang)*d, 3, 0, Math.PI*2);
      ctx.fill();
    }
  }
  for (const h of hearts) {
    const s = worldToScreen(h.x, h.y - h.t * 30);
    const a = 1 - h.t / 1.5;
    const size = 6 * camera.zoom;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ff5a9c';
    ctx.beginPath();
    ctx.moveTo(0, size*0.6);
    ctx.bezierCurveTo(size, size*0.1, size, -size*0.5, 0, -size*0.1);
    ctx.bezierCurveTo(-size, -size*0.5, -size, size*0.1, 0, size*0.6);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  for (const p of poofs) {
    const s = worldToScreen(p.x, p.y);
    const a = 1 - p.t / 0.8;
    const radius = 10 + p.t * 60;
    ctx.strokeStyle = `rgba(255, 255, 255, ${a})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.x, s.y, radius * camera.zoom, 0, Math.PI*2); ctx.stroke();
    for (let i = 0; i < 8; i++) {
      const ang = i * Math.PI/4;
      const d = radius * camera.zoom;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(s.x + Math.cos(ang)*d, s.y + Math.sin(ang)*d, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

function drawMinimap() {
  const theme = levelTheme();
  const w = miniCanvas.width, h = miniCanvas.height;
  miniCtx.fillStyle = level === 3 ? '#2a1a4a' : '#f7ffe8';
  miniCtx.fillRect(0,0,w,h);
  const sx = w / COLS, sy = h / ROWS;
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (maze[y][x] === 1) {
        miniCtx.fillStyle = theme.wall1;
        miniCtx.fillRect(x*sx, y*sy, sx+1, sy+1);
      }
    }
  }
  miniCtx.fillStyle = '#c9a0ff';
  miniCtx.fillRect(startCastle.cx*sx, startCastle.cy*sy, sx*1.5, sy*1.5);
  miniCtx.fillStyle = '#ffd24a';
  miniCtx.fillRect(goalCastle.cx*sx, goalCastle.cy*sy, sx*1.5, sy*1.5);
  for (const g of gems) {
    if (g.collected) continue;
    miniCtx.fillStyle = '#ff5a9c';
    miniCtx.fillRect(g.cx*sx, g.cy*sy, sx, sy);
  }
  for (const gate of gates) {
    if (gate.open) continue;
    miniCtx.fillStyle = '#8a5a2a';
    miniCtx.fillRect(gate.cx*sx, gate.cy*sy, sx, sy);
  }
  for (const gh of ghosts) {
    if (!gh.alive) continue;
    miniCtx.fillStyle = gh.hostile ? '#ff3366' : '#b4a4ff';
    miniCtx.fillRect((gh.x/TILE)*sx - 1, (gh.y/TILE)*sy - 1, 3, 3);
  }
  miniCtx.fillStyle = '#4da6ff';
  miniCtx.fillRect((princess.x/TILE)*sx - 2, (princess.y/TILE)*sy - 2, 4, 4);
}

function drawSkyBackground() {
  const theme = levelTheme();
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, theme.sky1);
  grad.addColorStop(1, theme.sky2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);

  drawSkyBackground();
  drawMaze();
  drawDressPads();
  drawPath();
  drawGems();
  drawGates();
  drawGhosts();
  drawFireballs();
  drawPrincess();
  drawEffects();
  drawMinimap();

  document.getElementById('gemCount').textContent = gems.filter(g=>g.collected).length;
  document.getElementById('gemTotal').textContent = gems.length;
  document.getElementById('time').textContent = gameTime.toFixed(1) + 's';

  requestAnimationFrame(loop);
}

generateMaze();
initEntities();
camera.x = princess.x;
camera.y = princess.y;
showLevelBanner();
requestAnimationFrame(loop);
</script>
